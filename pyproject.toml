[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rfx1427-finance"
version = "4.7.1"
description = "Python fetch layer for RFX1427 Finance (Phase 1, 2, 3)"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31,<3",
  "beautifulsoup4>=4.12,<5",
  "lxml>=5.0,<6",
  "feedparser>=6.0,<7",
  "yfinance>=0.2,<1",
]

[project.scripts]
rfx1427-phase1 = "rfx1427.phase1:main"
rfx1427-phase2 = "rfx1427.phase2:main"
rfx1427-phase3 = "rfx1427.phase3:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
